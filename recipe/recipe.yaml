context:
  build_number: 0
  name: ocaml-findlib
  version: 1.9.8

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: http://download.camlcity.org/download/findlib-${{ version }}.tar.gz
  sha256: 662c910f774e9fee3a19c4e057f380581ab2fc4ee52da4761304ac9c31b8869d

build:
  number: ${{ build_number }}
  skip:
    - win
  prefix_detection:
    force_file_type:
      text:
        - lib/ocaml/site-lib/findlib/Makefile.config
        - lib/ocaml/topfind
        - etc/findlib.conf
    ignore:
      # Only ignore bytecode files (binary format, relocation corrupts them)
      - lib/ocaml/site-lib/**/*.cma
      - lib/ocaml/site-lib/**/*.cmi
      - lib/ocaml/site-lib/**/*.cmx
      - lib/ocaml/site-lib/**/*.cmt
      - lib/ocaml/site-lib/**/*.cmti
  script: build.sh

requirements:
  build:
    - ${{ compiler('ocaml') }}
    - ${{ stdlib("c") }}
    - bash >=5.2
    - make
    - sed
    - grep
  run_constraints:
    - ocaml_${{ target_platform }} >=${{ ocaml_compiler_version }}

tests:
  - script:
      # findlib.conf must resolve and point inside the prefix
      - ocamlfind printconf
      # the package registry must be readable
      - ocamlfind list
      # control: findlib's own META is always installed, so this must resolve
      - ocamlfind query findlib
      # subject: a META file findlib ships for an OCaml stdlib library
      - ocamlfind query str
      # end-to-end compile and link through the ocamlfind driver.
      # ocamlc (bytecode) is deliberate: it needs no C linker, so the test
      # environment stays at just ocaml-compiler.
      - |
        cat > test_link.ml <<'EOF'
        let () = print_string (Str.global_replace (Str.regexp "a") "b" "aaa")
        EOF
      - ocamlfind ocamlc -package str -linkpkg test_link.ml -o test_link
      - test "$(./test_link)" = "bbb"
    requirements:
      run:
        - ocaml-compiler

  # Cross-compilation tests (aarch64/ppc64le, run under emulation)
  - if: unix and (build_platform != target_platform)
    then:
      script:
        - bash testing/test_cross.sh
      requirements:
        run:
          - file
          - ocaml-compiler
      files:
        recipe:
          - testing/test_cross.sh

  # Native Unix tests (Linux/macOS): full driver, native codegen and topfind
  - if: unix and (build_platform == target_platform)
    then:
      script:
        - bash testing/test_native.sh
      requirements:
        run:
          - if: linux
            then:
              - gcc_${{ target_platform }}
          - if: osx
            then:
              - clang_${{ target_platform }}
              - lld
              - llvm-tools
          - grep
          - ocaml-compiler
      files:
        recipe:
          - testing/test_native.sh

about:
  homepage: http://projects.camlcity.org/projects/findlib.html
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'OCaml library manager and package finder'
  documentation: http://projects.camlcity.org/projects/dl/findlib-${{ version }}/doc/guide-html/index.html
  repository: https://github.com/ocaml/ocamlfind

extra:
  recipe-maintainers:
    - dslarm
    - isuruf
    - slel
    - MementoRC
